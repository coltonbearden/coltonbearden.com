name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { package_json_file: site/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm, cache-dependency-path: site/pnpm-lock.yaml }
      - run: node --test tools/dns/lib.test.mjs
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:build
      - run: pnpm exec lhci autorun --config=lighthouserc.json
